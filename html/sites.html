<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/fonts.css">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sites.css">
    <script src="../js/sites.js"></script>
    <title>LollipopEXT - History</title>
</head>
<body>
    <div class="main-div">
        <div class="menu-div">
            <div class="logo-div">
                <div class="logo-name">
                    <span class="Lollipop">Lollipop</span>
                    <span class="EXT">EXT</span>
                </div>
                <div class="separator"></div>
            </div>
            <div class="menu-buttons">
                <div id="dashboard-btn" class="dashboard-btn">
                    <span>Dashboard</span>
                </div>
                <div id="sites-btn" class="sites-btn">
                    <span>Sites</span>
                </div>
                <div id="profiles-btn" class="profiles-btn">
                    <span>Profiles</span>
                </div>
                <div id="settings-btn" class="settings-btn">
                    <span>Settings</span>
                </div>
                <div id="history-btn" class="history-btn">
                    <span>History</span>
                </div>
            </div>
            <div class="lollipop-information-div">
                <div class="information-div">
                    <div class="pulsating-div">
                        <div class="stable-circle"></div>
                        <div class="pulsating-circle"></div>
                    </div>
                    <span class="version">Version 0.02</span>
                </div>
            </div>
        </div>
        <div class="main-content">
            <span class="sites-txt">Supported sites</span>
            <div class="supported-sites-div-3">
                <div id="airness" class="airness">
                    <div class="border-color"></div>
                    <div class="site-specifics-airness">
                        <span>Airness</span>
                        <div class="airness-pulsating-div">
                            <div class="airness-stable-circle-online" id="airness-stable-circle-online"></div>
                            <div class="airness-pulsating-circle-online" id="airness-pulsating-circle-online"></div>
                        </div>
                    </div>
                </div>
                <div id="snipes" class="snipes">
                    <div class="border-color"></div>
                    <div class="site-specifics-snipes">
                        <span>Snipes</span>
                        <div class="snipes-pulsating-div">
                            <div class="snipes-stable-circle-online" id="snipes-stable-circle-online"></div>
                            <div class="snipes-pulsating-circle-online" id="snipes-pulsating-circle-online"></div>
                        </div>
                    </div>
                </div>
                <div id="solebox" class="solebox">
                    <div class="border-color"></div>
                    <div class="site-specifics-solebox">
                        <span>Solebox</span>
                        <div class="solebox-pulsating-div">
                            <div class="solebox-stable-circle-online" id="solebox-stable-circle-online"></div>
                            <div class="solebox-pulsating-circle-online" id="solebox-pulsating-circle-online"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="supported-sites-div-3-2">
                <div id="lvr" class="lvr">
                    <div class="border-color"></div>
                    <div class="site-specifics-lvr">
                        <span>LVR</span>
                        <div class="lvr-pulsating-div">
                            <div class="lvr-stable-circle-online" id="lvr-stable-circle-online"></div>
                            <div class="lvr-pulsating-circle-online" id="lvr-pulsating-circle-online"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
