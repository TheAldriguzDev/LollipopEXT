<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/fonts.css">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/snipes.css">
    <script src="../js/snipes.js"></script>
    <title>LollipopEXT - Snipes</title>
</head>
<body>
    <div class="main-div">
        <div class="menu-div">
            <div class="logo-div">
                <div class="logo-name">
                    <span class="Lollipop">Lollipop</span>
                    <span class="EXT">EXT</span>
                </div>
                <div class="separator"></div>
            </div>
            <div class="menu-buttons">
                <div id="dashboard-btn" class="dashboard-btn">
                    <span>Dashboard</span>
                </div>
                <div id="sites-btn" class="sites-btn">
                    <span>Sites</span>
                </div>
                <div id="profiles-btn" class="profiles-btn">
                    <span>Profiles</span>
                </div>
                <div id="settings-btn" class="settings-btn">
                    <span>Settings</span>
                </div>
                <div id="history-btn" class="history-btn">
                    <span>History</span>
                </div>
            </div>
            <div class="lollipop-information-div">
                <div class="information-div">
                    <div class="pulsating-div">
                        <div class="stable-circle"></div>
                        <div class="pulsating-circle"></div>
                    </div>
                    <span class="version">Version 0.02</span>
                </div>
            </div>
        </div>
        <div class="main-content">
            <span class="sites-txt">Snipes settings</span>
            <div class="snipes-content">
                <div class="selectActive">
                    <span class="active-txt">Select module status:</span>
                    <div class="B4BSwitch">
                        <label>
                            <label class="switch">
                             <input type="checkbox" type="checkbox" name="SnipesWorking" id="SnipesWorking" checked="true">
                             <span class="slider round"></span>
                           </label>
                        </label>
                    </div>
                </div>

                <div class="sizes">
                    <div class="min-size-div">
                        <span>Min size:</span>
                        <select name="Min" id="rangeMinSnipes" class="sizeMinSnipes">
                            <option value="1">Select...</option>
                            <option value="35.5">35.5</option>
                            <option value="36">36</option>
                            <option value="36.5">36.5</option>
                            <option value="37">37</option>
                            <option value="37.5">37.5</option>
                            <option value="38">38</option>
                            <option value="38.5">38.5</option>
                            <option value="39">39</option>
                            <option value="39.5">39.5</option>
                            <option value="40">40</option>
                            <option value="40.5">40.5</option>
                            <option value="41">41</option>
                            <option value="42">42</option>
                            <option value="42.5">42.5</option>
                            <option value="43">43</option>
                            <option value="44">44</option>
                            <option value="44.5">44.5</option>
                            <option value="45">45</option>
                            <option value="45.5">45.5</option>
                            <option value="46">46</option>
                            <option value="47">47</option>
                            <option value="47.5">47.5</option>
                            <option value="48">48</option>
                            <option value="48.5">48.5</option>
                            <option value="49">49</option>
                            <option value="49.5">49.5</option>
                            <option value="50">50</option>
                            <option value="50.5">50.5</option>
                    </select>
                    </div>
    
                    <div class="max-size-div">
                        <span>Max size:</span>
                        <select name="Max" id="rangeMaxSnipes" class="sizeMaxSnipes">
                            <option value="1">Select...</option>
                            <option value="35.5">35.5</option>
                            <option value="36">36</option>
                            <option value="36.5">36.5</option>
                            <option value="37">37</option>
                            <option value="37.5">37.5</option>
                            <option value="38">38</option>
                            <option value="38.5">38.5</option>
                            <option value="39">39</option>
                            <option value="39.5">39.5</option>
                            <option value="40">40</option>
                            <option value="40.5">40.5</option>
                            <option value="41">41</option>
                            <option value="42">42</option>
                            <option value="42.5">42.5</option>
                            <option value="43">43</option>
                            <option value="44">44</option>
                            <option value="44.5">44.5</option>
                            <option value="45">45</option>
                            <option value="45.5">45.5</option>
                            <option value="46">46</option>
                            <option value="47">47</option>
                            <option value="47.5">47.5</option>
                            <option value="48">48</option>
                            <option value="48.5">48.5</option>
                            <option value="49">49</option>
                            <option value="49.5">49.5</option>
                            <option value="50">50</option>
                            <option value="50.5">50.5</option>
                        </select>
                    </div>
                </div>

                <div class="modes">
                    <div class="mode-div">
                        <span>Select mode: </span>
                        <select name="modes" id="modeSnipes" class="modeSnipes">
                            <option value="human-classic">Select...</option>
                            <option value="request">Request</option>
                            <option value="human">Human</option>
                            <option value="human-safe">Human Safe</option>
                        </select>
                    </div>
                    <div class="delay-div">
                        <span>Delay: </span>
                        <input type="text" class="delay-input", id="delay-input" placeholder="Delay...">
                    </div>
                </div>
                
                
            </div>
            <div id="back-to-sites-div" class="back-to-sites-div">
                <span>Go to sites page</span>
            </div>
        </div>
    </div>
</body>
</html>
